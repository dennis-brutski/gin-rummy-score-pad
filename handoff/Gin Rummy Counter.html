  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    // Best-effort: register a minimal service worker so the app can be
    // installed and run offline on hosted origins. We construct it from a
    // Blob URL so the whole thing stays self-contained. Browsers refuse
    // SW registration on file:// — that's fine, we just skip in that case.
    (function () {
      try {
        if (!('serviceWorker' in navigator)) return;
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
        const sw = [
          "self.addEventListener('install', e => self.skipWaiting());",
          "self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));",
          // Cache the navigation response on first visit, serve from cache
          // afterwards. The single-file app means there's nothing else to
          // intercept.
          "const CACHE = 'gr-counter-v1';",
          "self.addEventListener('fetch', e => {",
          "  if (e.request.mode !== 'navigate') return;",
          "  e.respondWith((async () => {",
          "    try {",
          "      const fresh = await fetch(e.request);",
          "      const cache = await caches.open(CACHE);",
          "      cache.put(e.request, fresh.clone());",
          "      return fresh;",
          "    } catch (err) {",
          "      const cached = await caches.match(e.request);",
          "      return cached || Response.error();",
          "    }",
          "  })());",
          "});",
        ].join('\n');
        const url = URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }));
        navigator.serviceWorker.register(url).catch(() => {});
      } catch (e) {}
    })();
  </script>

  <script type="text/babel" data-presets="react">
    // Mount: render App in a plain rounded "card" — no phone chrome, no
    // fake status bar. On a tall enough viewport (≥ device height) we cap
    // the card to the mobile size (402×874) and center it on a dark
    // walnut stage; on shorter viewports we let it fill the screen edge to
    // edge so the felt becomes the page background.
    const root = ReactDOM.createRoot(document.getElementById('frame-mount'));

    const DEVICE_W = 402, DEVICE_H = 874;

    function Shell() {
      const [bounded, setBounded] = React.useState(true);
      React.useEffect(() => {
        const fit = () => {
          // Card form (rounded, drop shadow) when the viewport is roomy
          // enough to letterbox; otherwise full-bleed for phones.
          const roomy = window.innerWidth >= 520 && window.innerHeight >= 720;
          setBounded(roomy);
        };
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);

      if (!bounded) {
        // Full-bleed: the body's .stage is hidden and the App takes the
        // whole screen.
        return (
          <div style={{
            position: 'fixed', inset: 0,
            display: 'flex', alignItems: 'stretch', justifyContent: 'stretch',
          }}>
            <App />
          </div>
        );
      }
      return (
        <div style={{
          width: DEVICE_W, height: DEVICE_H,
          borderRadius: 28,
          overflow: 'hidden',
          boxShadow:
            '0 1px 0 rgba(255,255,255,0.04) inset,' +
            '0 30px 60px rgba(0,0,0,0.55),' +
            '0 0 0 1px rgba(0,0,0,0.45)',
          background: '#000',
          position: 'relative',
        }}>
          <App />
        </div>
      );
    }

    root.render(<Shell />);
  </script>
